<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eslatmalar</title>
  <style>
    * {
      border-radius: 10px;
    }
    body {
      font-family: Arial, sans-serif;
      background: #eee;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      background: #fff;
      padding: 15px;
      border: 1px solid #ccc;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      margin-bottom: 20px;
    }

    textarea {
      width: 100%;
      height: 100px;
      margin-bottom: 10px;
      font-size: 14px;
      padding: 10px;
      border: 1px solid #aaa;
    }

    button {
      background-color: #3498db;
      color: white;
      padding: 10px 20px;
      border: none;
      cursor: pointer;
    }

    .notes {
      margin-top: 20px;
    }

    .note {
      border: 1px solid #bbb;
      background: #f9f9f9;
      padding: 10px;
      margin-bottom: 10px;
    }

    .note h3 {
      font-size: 16px;
      margin-bottom: 5px;
    }

    .note p {
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Mening Eslatmalarim</h1>

    <textarea placeholder="Eslatma yozing..."></textarea>
    <button>Eslatma qo‘shish</button>

    <div class="notes">
      <div class="note">
        <h3>O'qish</h3>
        <p>JavaScript qayta takrorlash</p>
      </div>
      <div class="note">
        <h3>Ish</h3>
        <p>Portfolio dizaynini yangilash</p>
      </div>
    </div>
  </div>
</body>
</html>
