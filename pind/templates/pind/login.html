<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Tizimga kirish</title>
</head>
<body>
<link rel="stylesheet" href="full.css">
    <form method="post" action="zametka.html" class="container-login">
<h2>🛡"Eslatmalar" dasturiga kirish</h2>
  <div class="canavas">
      <input type="text" name="username" class="input-login">
  <input type="password" name="password" class="input-password">
  </div>
  <button type="submit" class="glow-on-hover">Login</button>
</form>

<style>
    * {
        margin: 0;
        padding: 0;
        font-family: "Times New Roman";
    }
    body {
        color: black;
        text-align: center;
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(125deg, #002bff, #ff0000);;
}
.container-login{
    color: black;
  width: 400px;
  height: 400px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  border-radius: 16px;
    gap: 40px;
   background: white;
}

.input-login{
  outline: none;
  border: 1px solid black;
  box-shadow: none;
  width: 220px;
  height: 50px;
  border-radius: 8px;
  margin: 4px;
  z-index: -9999999999999;
}
.input-password{
  outline: none;
  border: 1px solid black;
  box-shadow: none;
  width: 220px;
  height: 50px;
  border-radius: 8px;
  margin: 4px;
}
.glow-on-hover {
  margin: 4px;;
    width: 220px;
    height: 50px;
    border: none;
    outline: none;
    color: black;
    border: 1px black solid;
    cursor: pointer;
    position: relative;
    z-index: 0;
    border-radius: 10px;
    font-size: 20px;
    background: black;
}

.glow-on-hover:before {
    content: '';
    background: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
    position: absolute;
    top: -2px;
    left:-2px;
    background-size: 400%;
    z-index: -1;
    filter: blur(5px);
    width: calc(100% + 4px);
    height: calc(100% + 4px);
    animation: glowing 20s linear infinite;
    opacity: 0;
    transition: opacity .3s ease-in-out;
    border-radius: 10px;
}

.glow-on-hover:active {
    color: white;
}

.glow-on-hover:active:after {
    background: transparent;
}

.glow-on-hover:hover:before {
    opacity: 1;
}

.glow-on-hover:after {
    z-index: -1;
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    background: #fff;
    left: 0;
    top: 0;
    border-radius: 10px;
}

@keyframes glowing {
    0% { background-position: 0 0; }
    50% { background-position: 400% 0; }
    100% { background-position: 0 0; }
}

</style>
</body>
</html>
